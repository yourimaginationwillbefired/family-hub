<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Family Hub — Login</title>
<style>body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f5f5f4}form{background:#fff;padding:32px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);min-width:300px}h1{font-size:20px;margin:0 0 16px}label{display:block;font-size:13px;margin:12px 0 4px}input{width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;box-sizing:border-box}button{margin-top:16px;width:100%;padding:10px;background:#111827;color:#fff;border:0;border-radius:6px;cursor:pointer}.err{color:#b91c1c;font-size:13px}</style>
</head>
<body>
<form method="post">
<h1>Family Hub — Login</h1>
{% if form.errors %}<p class="err">Please check your username and password and try again.</p>{% endif %}
{% csrf_token %}
<label>Username</label>{{ form.username }}
<label>Password</label>{{ form.password }}
<button type="submit">Log in</button>
</form>
</body>
</html>
